server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html no se cachea: referencia los assets con hash del build actual.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # assets versionados por Vite (nombre con hash) -> cache larga.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta no encontrada cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
