name: Release APK + landing page

# Compila el APK de Flutter en cada push a main y lo publica como asset de
# un Release fijo ("latest-apk", se sobreescribe en cada corrida), y
# despliega docs/landing/ a GitHub Pages. Requiere que el repo sea PÚBLICO:
# tanto GitHub Pages como los assets de un Release solo son descargables
# sin sesión de GitHub en repos públicos — ver docs/landing/README.md.
on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - "docs/landing/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://homelab.tail8dc7f1.ts.net

      - name: Renombrar el APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk me-alcanza.apk

      - name: Publicar/actualizar el Release "latest-apk"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Me Alcanza — APK (build automático)"
          make_latest: false
          body: |
            APK generado automáticamente desde `${{ github.sha }}` en cada push a `main`
            que toque `flutter_app/`. Apunta al backend público
            `https://homelab.tail8dc7f1.ts.net` (firmado con la clave de debug de
            Flutter — suficiente para instalar manualmente, no para Play Store).
          files: me-alcanza.apk

  deploy-landing:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing
      - id: deployment
        uses: actions/deploy-pages@v4
