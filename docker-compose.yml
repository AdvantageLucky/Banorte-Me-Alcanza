services:
  backend:
    build: .
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      BANK_DB_PATH: /data/banco.db
    volumes:
      - banco-db:/data
    restart: unless-stopped

volumes:
  banco-db:
