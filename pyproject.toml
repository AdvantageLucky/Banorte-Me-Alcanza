[project]
name = "me-alcanza"
version = "0.1.0"
description = "Asistente de flujo de caja con UI generativa (HackMTY 2026)"
requires-python = ">=3.14"
dependencies = [
    "a2ui-agent-sdk>=0.6.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "mcp>=2.2.0",
    "openai>=3.13,<4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
me-alcanza = "me_alcanza.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
